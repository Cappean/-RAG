[project]
name = "medical-consultation-backend"
version = "0.1.0"
description = "医疗智能问诊后端基础框架"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.8,<3",
    "pymongo>=4.13,<5",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[project.scripts]
medical-api = "medical_consultation_backend.cli:api"
medical-worker = "medical_consultation_backend.cli:worker"
medical-init-db = "medical_consultation_backend.cli:init_db"
medical-enqueue-demo = "medical_consultation_backend.cli:enqueue_demo"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
